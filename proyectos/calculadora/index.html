<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Calculadora Web</title><style>body{font-family:Arial;background:#091225;color:white;display:grid;place-items:center;min-height:100vh}.box{width:360px;background:#070f1d;padding:25px;border-radius:22px}.screen{background:#111c31;padding:20px;text-align:right;font-size:32px;border-radius:14px;margin:15px 0}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}button{padding:18px;border:0;border-radius:10px;font-size:18px;font-weight:bold;background:#1c2a43;color:white}button.op{background:#19aeea;color:#03101b}.history{margin-top:18px;background:#111c31;padding:12px;border-radius:12px;max-height:110px;overflow:auto;color:#a9bfd8}small{color:#72d5ff}</style></head><body><div class="box"><small>PROYECTO WEB</small><h1>Calculadora</h1><div class="screen" id="screen">0</div><div class="keys"><button onclick="clearAll()">AC</button><button onclick="back()">⌫</button><button onclick="add('%')">%</button><button class="op" onclick="add('/')">÷</button><button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('*')">×</button><button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('-')">−</button><button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('+')">+</button><button style="grid-column:span 2" onclick="add('0')">0</button><button onclick="add('.')">.</button><button class="op" onclick="calc()">=</button></div><div class="history"><b>Historial de operaciones</b><div id="hist"></div></div></div><script>let e='';const s=document.getElementById('screen'),h=document.getElementById('hist');function add(x){e+=x;s.textContent=e}function clearAll(){e='';s.textContent='0'}function back(){e=e.slice(0,-1);s.textContent=e||'0'}function calc(){try{let r=Function('return '+e)();h.innerHTML='<div>'+e+' = '+r+'</div>'+h.innerHTML;e=String(r);s.textContent=e}catch{s.textContent='Error';e=''}}document.addEventListener('keydown',x=>{if(/[0-9+\-*/.%]/.test(x.key))add(x.key);if(x.key==='Enter')calc();if(x.key==='Backspace')back();if(x.key==='Escape')clearAll()})</script></body></html>
